# Запись changelog едет вместе с изменением (#10).
#
# ПОЧЕМУ ТЕ ЖЕ СОБЫТИЯ, ЧТО У РАЗМЕТКИ. Нужна ли запись, решает **тип** PR:
# правка документов её не требует. Тип — это метка, и он меняется событием
# `labeled`, которого в дереве не видно. Без него проверка отвечала бы про тип
# на момент последнего пуша, и смена типа не давала бы зелёного.
#
# ПОЧЕМУ СПИСОК ФАЙЛОВ ИЗ git, А НЕ ИЗ API. `git diff` отвечает без квоты и без
# токена. Оговорка «прогон уже держит оба коммита» оказалась неверной и снята по
# замеру: `fetch-depth: 0` берёт merge-ref, а тот живёт своей жизнью, и на
# событии `edited` шаг дважды упал с «Invalid symmetric difference expression».
# Поэтому наличие обоих концов теперь проверяется явно, а не предполагается.
#
# ПОЧЕМУ ИМЕНА ПЕРЕМЕННЫХ ЗДЕСЬ ЛАТИНСКИЕ — а весь остальной проект русский.
# Внутренний язык проекта распространяется на прозу и на идентификаторы Python,
# но **не на shell**: bash допускает в имени переменной только ASCII. Первая
# редакция этого файла писала `файлы=$(git diff …)`, и bash разобрал строку как
# команду — прогон упал с кодом 127. Второй случай был опаснее и не покраснел
# бы вовсе: `env:` с ключом `ТИП` кладёт переменную в окружение, но `$ТИП` в
# bash не раскрывается, потому что парсер требует ASCII-идентификатор.
# Подстановка вышла бы пустой, условие «нужна ли запись» всегда давало бы
# «нет», и гейт отключился бы молча, оставаясь зелёным.
name: запись changelog

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  entry:
    name: запись есть и она на языке проекта
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          # Нужны оба конца: список изменённых файлов считается по `base...head`,
          # и на мелком клоне общего предка просто нет.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: собрать список изменённых файлов
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # ОБА КОНЦА ОБЯЗАНЫ БЫТЬ В КЛОНЕ, и `fetch-depth: 0` этого НЕ
          # гарантирует. Замер 2026-09-02: на событии `edited` шаг дважды подряд
          # упал с «Invalid symmetric difference expression», хотя двумя
          # прогонами раньше на той же голове был зелёным. Событие `edited`
          # файлов не меняет вовсе — то есть отказ приходил там, где проверять
          # было нечего.
          #
          # Причина в том, что checkout берёт merge-ref, а он живёт своей
          # жизнью: площадка пересчитывает его при правке PR, и в момент
          # пересчёта в клон попадает не то. Дотягиваем недостающее явно.
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "::notice::коммита ${sha} нет в клоне — дотягиваю ветки"
              git fetch --no-tags --quiet origin '+refs/heads/*:refs/remotes/origin/*' || true
            fi
          done
          # ОТКАЗ НАЗЫВАЕТ, ЧЕГО НЕ ХВАТИЛО. Выражение git говорит «invalid
          # symmetric difference» и не называет ни одного коммита — искать
          # причину по такому сообщению пришлось бы с нуля каждый раз.
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "::error::коммита ${sha} нет в клоне и он не дотянулся: список изменённых файлов не собрать, а считать его пустым нельзя — гейт молча пропустил бы PR без записи"
              exit 1
            fi
          done
          files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "изменённых файлов: $(printf '%s' "$files" | wc -w)"

      # Черновик и PR из форка проверяются мягко — по той же границе, что и у
      # разметки: запись доводят к готовности, а внешний участник наших правил
      # не знает.
      - name: запись обязательна?
        id: need
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          set -euo pipefail
          required=no
          case " $PR_LABELS " in
            *" bug "*|*" enhancement "*) required=yes ;;
          esac
          if [ "$PR_DRAFT" = "true" ] || [ "$PR_FORK" = "true" ]; then
            required=no
            echo "::notice::черновик или форк — запись не требуется, проверяется только язык"
          fi
          echo "value=$required" >> "$GITHUB_OUTPUT"
          echo "запись обязательна: $required (метки: $PR_LABELS)"

      - name: проверить записи
        run: |
          python scripts/changelog.py \
            ${{ steps.need.outputs.value == 'yes' && '--require-entry' || '' }} \
            --changed ${{ steps.changed.outputs.files }}
