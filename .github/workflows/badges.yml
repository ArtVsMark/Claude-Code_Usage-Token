# Значки витрины. Живут на ОТДЕЛЬНОЙ ветке `badges`, а не в `main`.
#
# ПОЧЕМУ НЕ В ОБЩЕЙ ВЕТКЕ. Значок в `main` пересобирается от КАЖДОГО изменения:
# у каталога это дало конфликт на каждом слиянии, три отставших изменения и
# красное на общей ветке — не потому, что что-то сломалось, а потому что число
# сдвинулось. Проверка, краснеющая на верной работе, — ровно та, которую
# приучаются пропускать (правило 051).
#
# ЧЕМ ЗА ЭТО ЗАПЛАЧЕНО, СКАЗАНО ВСЛУХ. Пока значок лежал в `main`, гейт витрины
# сверял его с деревом тем же прогоном, что и всё остальное, и застыть он не
# мог. На ветке этой сверки нет по построению. Свежесть держит эта работа: она
# идёт на каждый толчок в общую ветку, и значок отстаёт максимум на один
# толчок, без участия автора (правило 096).
#
# ЧТО ГЕЙТ ПРОВЕРЯЕТ ПО-ПРЕЖНЕМУ: что значок объявлен витриной, показан в обеих
# и что правило его вывода существует. Последнее проверяется ДО выхода по
# ветке — иначе переезд снял бы эту проверку молча вместе со сверкой файла.
name: значки

on:
  push:
    branches: [main]
  release:
    types: [published]
  # СВЕЖЕСТЬ НЕ ДОЛЖНА ЗАВИСЕТЬ ОТ ТОГО, ИДЁТ ЛИ РАБОТА. С 8 по 30 сентября в
  # общую ветку не пришло ни одного толчка, и `generated_at` простоял 23 дня —
  # дольше порога витрины в 14. Прогон был исправен, а витрина объявила бы
  # факты устаревшими (#123). Раз в неделю — вдвое чаще порога.
  # Не в 0 и не в 30: минута выбрана так, чтобы не совпадать с пиком.
  schedule:
    - cron: "41 5 * * 1"
  # ЕДИНЫЙ ЗНАЧОК КРАСИТСЯ ИСХОДОМ ПРОГОНОВ, которые на толчке ещё идут:
  # сборка по толчку видит ПРОШЛЫЙ исход. Поэтому значки пересобираются и
  # когда основной CI или прогон следующей версии ЗАВЕРШИЛСЯ на общей ветке —
  # иначе цвет отставал бы на целое слияние (#128). Имена дословные: это
  # `name:` прогонов, площадка сверяет их буквально.
  workflow_run:
    workflows: [ci, python-next]
    types: [completed]
    branches: [main]
  # У события всегда есть ручная кнопка.
  workflow_dispatch:

permissions:
  # Положить собранное на ветку `badges`.
  contents: write
  # Исходы прогонов для единого значка читаются у площадки (#128).
  actions: read

concurrency:
  # На репозиторий: два прогона разом положили бы на ветку разное, и последний
  # затёр бы первого. Отмена включена — значок нужен только последний: любой
  # прогон собирает ВСЁ с головы общей ветки, и вытесненный ничего не уносит.
  group: badges
  cancel-in-progress: true

jobs:
  publish:
    name: собрать и положить на ветку
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      # ПОЛНАЯ ИСТОРИЯ С ТЕГАМИ: поле `release` фактов — ближайший тег выпуска,
      # а в мелком клоне его не видно. Сборщик в таком клоне отказывает, а не
      # пишет «выпусков нет»: эта ложь у витрины уже была и пережила два выпуска.
      #
      # На `workflow_run` файл прогона берётся с общей ветки, и выкачка
      # закреплена за ней же (правило 152 каталога): права здесь — права общей
      # ветки. На прочих событиях — их собственная ссылка: у выпуска это тег.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # ЗАМЕР ПОКРЫТИЯ ДЕЛАЕТСЯ ЗДЕСЬ, и за него заплачено установкой набора
      # разработки. Прежде этот прогон обходился стандартной библиотекой, и это
      # было его заявленным свойством; свойство снято сознательно, потому что
      # покрытие иначе неоткуда взять — число, проставленное руками, застыло бы
      # на первом же изменении, а застывший значок с витрины неотличим от
      # честного (правило 046).
      #
      # ЯЧЕЙКА ОДНА И НАЗВАНА: ubuntu, python 3.14 — та же, на которой идёт весь
      # этот прогон. Мерить на всей матрице значило бы получать три разных
      # числа об одной величине и выбирать между ними (правило 022).
      #
      # ЧТО СЧИТАЕТСЯ ПОКРЫТЫМ, объявлено в pyproject.toml: обе половины дерева,
      # `src/` и `scripts/`. Доля по половине кода, выданная за долю по всему, и
      # есть та цифра, которая выглядит правдоподобно и врёт.
      - name: поставить проект и набор разработки
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev

      - name: замерить покрытие
        run: |
          python -m coverage run -m pytest -q
          python -m coverage json -o coverage.json

      - name: собрать значки
        run: python scripts/badges.py

      # ФАКТЫ — НЕ ЗНАЧОК, И СОБИРАЮТСЯ ОТДЕЛЬНО. Значок отвечает читателю
      # витрины картинкой, `facts.json` — соседней витрине машиночитаемо, и
      # вопросы у них разные: числа тестов и проверок значком не показывают
      # (`.rules/showcase.json` называет причину), а в фактах они уместны.
      #
      # Замер, ради которого контракт соседа появился: витрина считала число
      # проверок МЕДИАНОЙ по семи последним изменениям и показывала 19 там, где
      # точный ответ издателя — 16. Считать снаружи значит держать копию чужого
      # определения; копия расходится молча (правило 174).
      #
      # Сборщик обходится стандартной библиотекой, как и всё здесь: раздел,
      # который нельзя посчитать точно, в файл не попадает вовсе.
      - name: собрать факты о проекте
        # Имя репозитория берётся ОТСЮДА, а не из `git remote`: клон, сделанный
        # до переименования, хранит старый адрес, и работает тот по редиректу.
        # Коммит — `GITHUB_SHA`, его площадка задаёт сама: на него пришло событие.
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/facts.py

      # ЕДИНЫЙ ЗНАЧОК «Python │ версии │ ОС │ coverage │ release / PyPI │
      # version» (#128, решение владельца 1 октября). Рисует действие каталога
      # из тега, а не копия в проекте (095). Стоит ПОСЛЕ сборки значков: число
      # покрытия и версию оно берёт из их файлов, а не меряет второй раз.
      # Входа `pypi` нет: в PyPI ничего не публикуется до 1.0, и зона выпуска
      # серая честно (вопрос pypi в .rules/showcase.json).
      #
      # ИСХОД 2 — площадка не ответила о прогонах или файл-источник негоден.
      # Серым это не перерисовывается: «не спросили» не значит «не
      # проводилась». Картинки в собранном тогда нет, и публикация ниже
      # оставляет на ветке прежнюю.
      #
      # ЦЕНА НАЗВАНА: снаружи составного действия исход 2 от исхода 1 (дефект)
      # не отличить — шаг виден только как failure. Поэтому любой отказ здесь
      # не роняет прогон, а печатает предупреждение: уронить его значило бы
      # заодно не опубликовать факты и прочие значки, которые собрались.
      - name: единый значок — проверки, покрытие, выпуск, версия
        id: python_badge
        continue-on-error: true
        uses: ArtVsMark/Engineering-Incidents-Playbook/.github/actions/python-badge@v1.6.0
        with:
          ci-workflow: ci.yml
          coverage-json: .github/badges/coverage.json
          version-json: .github/badges/version.json
          out: .github/badges/python.svg

      - name: единый значок не собран — прежний остаётся
        if: steps.python_badge.outcome == 'failure'
        run: |
          echo "::warning::единый значок не собран — на ветке badges остаётся прежний"
          rm -f .github/badges/python.svg

      - name: положить на ветку badges
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/badges"
          mkdir -p "$tmp/.github/badges"
          # Копируется ВСЁ собранное. Перечислять поимённо значило бы завести
          # второй список значков рядом с .rules/showcase.json — две
          # классификации одной территории расходятся молча (правило 022).
          cp .github/badges/*.json "$tmp/.github/badges/"
          # Картинка — только если собрана. Несобранная не копируется, и ниже
          # прежняя остаётся на ветке: стирается только `*.json`.
          if [ -f .github/badges/python.svg ]; then
            cp .github/badges/python.svg "$tmp/.github/badges/"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Дерево после сборки грязное: значки записаны поверх. Переключиться
          # с такого дерева git отказывается, поэтому собранное уже лежит в
          # $RUNNER_TEMP, а рабочее дерево можно выбросить целиком.
          rm -f coverage.json .coverage
          git checkout -- .
          git clean -fd -- .github/badges >/dev/null 2>&1 || true

          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch origin badges --depth 1
            git checkout badges
          else
            git checkout --orphan badges
            git rm -rf . >/dev/null 2>&1 || true
          fi

          # ВЕТКА — ПРОЕКЦИЯ СОБРАННОГО, А НЕ НАКОПИТЕЛЬ. Значок, который
          # перестали собирать, обязан исчезнуть и отсюда: в общей ветке его
          # нет, гейт витрины его не видит, и брошенный файл отвечал бы вечно,
          # не имея производителя.
          mkdir -p .github/badges
          rm -f .github/badges/*.json
          cp "$tmp/.github/badges/"* .github/badges/

          # `-f` обязателен: в общей ветке значки под .gitignore, и без него
          # добавление молча не произошло бы — а сторож ниже увидел бы
          # «значки не изменились» и вышел зелёным, ничего не опубликовав.
          git add -f .github/badges
          # Короткое замыкание осталось от времён, когда собирались только
          # значки. С фактами оно почти не срабатывает: `generated_at` сдвигается
          # каждым прогоном, и это НАМЕРЕННО — файл не исчезает, когда сборка
          # ломается, он остаётся вчерашним, и снаружи это неотличимо от «числа
          # не менялись». Отметка даёт витрине право сказать «факты устарели»
          # вместо того, чтобы показывать прошлое как настоящее.
          if git diff --cached --quiet; then
            echo "значки и факты не изменились"
            exit 0
          fi
          # `[skip ci]` — чтобы толчок на `badges` не будил прогоны заново.
          git commit -m "chore(ci): обновить значки и факты [skip ci]"
          git push origin badges
          echo "значки и факты обновлены на ветке badges"
