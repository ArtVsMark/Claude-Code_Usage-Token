# Значки витрины. Живут на ОТДЕЛЬНОЙ ветке `badges`, а не в `main`.
#
# ПОЧЕМУ НЕ В ОБЩЕЙ ВЕТКЕ. Значок в `main` пересобирается от КАЖДОГО изменения:
# у каталога это дало конфликт на каждом слиянии, три отставших изменения и
# красное на общей ветке — не потому, что что-то сломалось, а потому что число
# сдвинулось. Проверка, краснеющая на верной работе, — ровно та, которую
# приучаются пропускать (правило 051).
#
# ЧЕМ ЗА ЭТО ЗАПЛАЧЕНО, СКАЗАНО ВСЛУХ. Пока значок лежал в `main`, гейт витрины
# сверял его с деревом тем же прогоном, что и всё остальное, и застыть он не
# мог. На ветке этой сверки нет по построению. Свежесть держит эта работа: она
# идёт на каждый толчок в общую ветку, и значок отстаёт максимум на один
# толчок, без участия автора (правило 096).
#
# ЧТО ГЕЙТ ПРОВЕРЯЕТ ПО-ПРЕЖНЕМУ: что значок объявлен витриной, показан в обеих
# и что правило его вывода существует. Последнее проверяется ДО выхода по
# ветке — иначе переезд снял бы эту проверку молча вместе со сверкой файла.
name: значки

on:
  push:
    branches: [main]
  release:
    types: [published]
  # У события всегда есть ручная кнопка.
  workflow_dispatch:

permissions:
  # Единственное право: положить собранное на ветку `badges`.
  contents: write

concurrency:
  # На репозиторий: два прогона разом положили бы на ветку разное, и последний
  # затёр бы первого. Отмена включена — значок нужен только последний.
  group: badges
  cancel-in-progress: true

jobs:
  publish:
    name: собрать и положить на ветку
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Ни установки пакета, ни группы dev: сборщик обходится стандартной
      # библиотекой, как и остальные скрипты конвейера.
      - name: собрать значки
        run: python scripts/badges.py

      - name: положить на ветку badges
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/badges"
          mkdir -p "$tmp/.github/badges"
          # Копируется ВСЁ собранное. Перечислять поимённо значило бы завести
          # второй список значков рядом с .rules/showcase.json — две
          # классификации одной территории расходятся молча (правило 022).
          cp .github/badges/*.json "$tmp/.github/badges/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Дерево после сборки грязное: значки записаны поверх. Переключиться
          # с такого дерева git отказывается, поэтому собранное уже лежит в
          # $RUNNER_TEMP, а рабочее дерево можно выбросить целиком.
          git checkout -- .
          git clean -fd -- .github/badges >/dev/null 2>&1 || true

          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch origin badges --depth 1
            git checkout badges
          else
            git checkout --orphan badges
            git rm -rf . >/dev/null 2>&1 || true
          fi

          # ВЕТКА — ПРОЕКЦИЯ СОБРАННОГО, А НЕ НАКОПИТЕЛЬ. Значок, который
          # перестали собирать, обязан исчезнуть и отсюда: в общей ветке его
          # нет, гейт витрины его не видит, и брошенный файл отвечал бы вечно,
          # не имея производителя.
          mkdir -p .github/badges
          rm -f .github/badges/*.json
          cp "$tmp/.github/badges/"* .github/badges/

          # `-f` обязателен: в общей ветке значки под .gitignore, и без него
          # добавление молча не произошло бы — а сторож ниже увидел бы
          # «значки не изменились» и вышел зелёным, ничего не опубликовав.
          git add -f .github/badges
          if git diff --cached --quiet; then
            echo "значки не изменились"
            exit 0
          fi
          # `[skip ci]` — чтобы толчок на `badges` не будил прогоны заново.
          git commit -m "chore(ci): обновить значки [skip ci]"
          git push origin badges
          echo "значки обновлены на ветке badges"
