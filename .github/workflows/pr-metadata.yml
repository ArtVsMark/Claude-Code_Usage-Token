# Разметка pull request: зона, тип, связь с задачей (#9).
#
# ОТДЕЛЬНО ОТ `ci.yml`, И ЭТО НЕ ВКУСОВЩИНА. `ci.yml` ходит по пушам, а ответ
# этой проверки меняется от событий, которых в дереве не видно вовсе: метку
# навесили, метку сняли, сняли черновик. Живи она рядом с прогоном гейтов, она
# отвечала бы про состояние меток на момент последнего пуша — то есть про
# прошлое, и починка «поставил метку» не давала бы зелёного.
#
# ПОЧЕМУ НЕ В `preflight`. Команда перед коммитом одна, и это правило (#5). Но
# preflight проверяет **дерево**, а разметки PR в дереве нет: локально её не
# существует, проверять нечего. Гейт, который человек не может прогнать у себя,
# в единую команду не складывается.
name: разметка PR

on:
  pull_request:
    # Состав событий — самая содержательная строка файла. Без `labeled` и
    # `unlabeled` проверка не перезапустится ровно тогда, когда её ответ
    # меняется, и красное осталось бы висеть после починки. Без
    # `ready_for_review` черновик, доведённый до готовности, уехал бы с
    # предупреждением вместо отказа.
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review
      - converted_to_draft

# Событие уже содержит и метки, и тело: ходить в API не нужно, и права на
# чтение pull request не запрашиваются.
permissions:
  contents: read

concurrency:
  # На PR, а не на репозиторий: правка меток у соседнего изменения не должна
  # отменять эту проверку.
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  labels:
    name: зона, тип, связь с задачей и имя ветки
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Ни установки пакета, ни группы dev: скрипт обходится стандартной
      # библиотекой и читает событие из файла. Ставить сюда зависимости значило
      # бы сделать проверку разметки заложницей сборки.
      - name: проверить разметку
        run: python scripts/check_pr_metadata.py
