# Входящие правила каталога ArtVsMark/Engineering-Incidents-Playbook.
#
# Собрано `scripts/onboard_consumer.py` каталога — руками не правится целиком,
# но закрепление тега и расписание менять можно и нужно осознанно.
#
# Своего скрипта здесь нет намеренно: реализация одна и живёт у автора
# каталога. Копия генератора в каждом проекте — это N реализаций одного
# алгоритма, и первая же правка разведёт их.
name: rules-inbox

on:
  schedule:
    # Не в 0 и не в 30: минута выбрана так, чтобы не совпадать с пиком.
    - cron: "17 6 * * *"
  # У события всегда есть ручная кнопка.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rules-inbox
  cancel-in-progress: true

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Закрепление поднято с v1.0.0 осознанно, как разрешает заголовок выше.
      # Контракт каталога (export/README.md) всё ещё называет v1.0.0, но в том
      # теге нет ни «переписи», ни ответа о снятом правиле — обе возможности
      # объявлены в задаче #21 и появились только в v1.1.0. На v1.0.0 прогон
      # работал бы молча по-старому, и расхождение обнаружилось бы не отказом,
      # а отсутствием строки, которую никто не ждёт увидеть отсутствующей.
      - uses: ArtVsMark/Engineering-Incidents-Playbook@v1.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Имя каталога называется явно по той же причине, что и у шага
          # обратных ссылок ниже: умолчание в закреплённой версии — СТАРОЕ имя.
          # Замер 2026-09-03: задача «входящие» несла ссылку на
          # `claude-code-playbook`, а экспорт тянулся по редиректу — и это при
          # зелёном прогоне, потому что редирект работает.
          catalogue: ArtVsMark/Engineering-Incidents-Playbook

      # Обратная сторона следа: у правила каталога есть номер задачи отсюда, а
      # у самой задачи о правиле не сказано ни слова. Читатель задачи не узнаёт,
      # что из неё вышло правило, и следующий разбор того же места начинается с
      # нуля — вывод прошлого лежит в другом репозитории.
      #
      # Замер 2026-09-03: восемь правил каталога ведут след сюда (048, 166–169,
      # 171, 175, 176), и ни одна из восьми задач об этом не знает.
      #
      # Инструмент каталога, а не свой: копия алгоритма у каждого потребителя —
      # это N реализаций одного (CONNECT.md, правила 090 и 022). Запускает его
      # потребитель — своим токеном и в свой трекер, каталог не рассылает.
      - uses: actions/checkout@v4
        with:
          repository: ArtVsMark/Engineering-Incidents-Playbook
          ref: v1.1.0
          path: .rules-catalogue
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: обратные ссылки на правила в задачах
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `--apply` обязателен: умолчание скрипта сухое, и это его решение —
        # «случайно запустил» не должно означать «прошёлся по восьми задачам».
        # Метка не ставится: её пришлось бы сперва завести в docs/labels.md,
        # а номенклатура меток — отдельное решение владельца.
        #
        # КОД берётся с закреплённого тега (шаг выше), а ДАННЫЕ — с `main`, и
        # это не небрежность. Первая редакция брала по тегу и то, и другое;
        # прогон прошёл зелёным и не сделал НИЧЕГО: в `v1.1.0` каталога 152
        # правила, и ни одно из них не ведёт след сюда — все восемь появились
        # позже тега. Механизм подтверждается прогоном, а не чтением, и
        # зелёный гейт подтверждает себя, а не утверждение, вокруг которого
        # построен.
        #
        # Схему выгрузки скрипт не проверяет: читает поле `trails`, которое
        # пережило подъём схемы с 1.1 на 1.2. Появится тег каталога новее —
        # закрепление поднимется вместе с ним, и данные снова сойдутся с кодом.
        #
        # ИМЯ КАТАЛОГА НАЗЫВАЕТСЯ ЯВНО, и это не многословность. Умолчание в
        # скрипте версии v1.1.0 — старое имя `claude-code-playbook`, в `main`
        # каталога оно уже поправлено. Первый рабочий прогон вписал в задачу
        # #63 ссылку на имя, которого больше нет: данные притянулись по
        # редиректу, и ничто не покраснело.
        #
        # Это собственное правило проекта (172, оно же наше предложение
        # каталогу): редирект держится, пока старое имя СВОБОДНО. Здесь цена не
        # битая ссылка — по этому адресу мы вставляем ссылки в свои же задачи.
        # Перепись `scripts/repo_links.py` такого не ловит: имя жило в чужом
        # скрипте, а не в нашем дереве. Названное здесь — ловит.
        # КОД 1 ПРИ `--apply` ОЗНАЧАЕТ «ДОПИСАНО», А НЕ ОТКАЗ. У скрипта три
        # исхода и два кода: `return 1 if missing else 0`, где `missing` —
        # список, посчитанный ДО записи и после неё не очищаемый. Без `--apply`
        # это верно («есть недостающие»), с `--apply` — ровно наоборот: до
        # строки возврата доходят только те прогоны, где все записи приняты,
        # отказ трекера выходит кодом 2 раньше.
        #
        # Замер 2026-09-04: прогон напечатал «задач со следом: 12; без обратной
        # ссылки было: 4 — дописано 4» и упал. Так падали ВСЕ прогоны с тех пор,
        # как данные стали браться живыми (#80) и работа появилась: три подряд,
        # 03.09 и 04.09. Сторож расписания (#90) завёл на это задачу #102 —
        # то есть отработал верно, а красным был не прогон, а его чтение.
        #
        # ПРОВЕРЯЕМ, А НЕ ВЕРИМ НА СЛОВО. Код 1 принимается не сам по себе, а
        # только вместе с напечатанным «дописано»: сухой прогон тоже выходит
        # единицей, и подменить смысл кода молча не выйдет. Смысл закреплён тем
        # же тегом, что и код (`v1.1.0` выше); поднимется тег — это место
        # пересматривается вместе с ним.
        run: |
          set -o pipefail
          out=$(python .rules-catalogue/scripts/link_trails.py \
            --catalogue ArtVsMark/Engineering-Incidents-Playbook \
            --ref main \
            --apply 2>&1) && code=0 || code=$?
          printf '%s\n' "$out"
          if [ "$code" -eq 1 ] && printf '%s' "$out" | grep -q 'дописано'; then
            echo "::notice::код 1 при --apply — это «дописано», а не отказ"
            code=0
          fi
          exit "$code"
