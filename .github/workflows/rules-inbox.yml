# Входящие правила каталога ArtVsMark/Engineering-Incidents-Playbook.
#
# Собрано `scripts/onboard_consumer.py` каталога — руками не правится целиком,
# но закрепление тега и расписание менять можно и нужно осознанно.
#
# Своего скрипта здесь нет намеренно: реализация одна и живёт у автора
# каталога. Копия генератора в каждом проекте — это N реализаций одного
# алгоритма, и первая же правка разведёт их.
name: rules-inbox

on:
  schedule:
    # Не в 0 и не в 30: минута выбрана так, чтобы не совпадать с пиком.
    - cron: "17 6 * * *"
  # У события всегда есть ручная кнопка.
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # Обратные ссылки ведут и в изменения, а не только в задачи: среди номеров со
  # следом сюда #62 и #87 — PR. Комментарий в PR площадка принимает от штатного
  # токена только с этим правом; без него 403 и третий исход (CONNECT.md
  # каталога, v1.4.0; замер 2 октября по живой выгрузке: 12 номеров, 2 из них PR).
  pull-requests: write

concurrency:
  group: rules-inbox
  cancel-in-progress: true

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Закрепление поднято с v1.0.0 осознанно, как разрешает заголовок выше.
      # Контракт каталога (export/README.md) всё ещё называет v1.0.0, но в том
      # теге нет ни «переписи», ни ответа о снятом правиле — обе возможности
      # объявлены в задаче #21 и появились только в v1.1.0. На v1.0.0 прогон
      # работал бы молча по-старому, и расхождение обнаружилось бы не отказом,
      # а отсутствием строки, которую никто не ждёт увидеть отсутствующей.
      #
      # v1.2.0 → v1.4.0 (#125), через v1.3.0. Перечитано: вход `ref` действия
      # теперь значит только «откуда ВЫГРУЗКА», а код берётся с тега этой
      # строки — прежде он приходил из подвижной main (095). Входы не менялись.
      - uses: ArtVsMark/Engineering-Incidents-Playbook@v1.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Имя каталога называется явно по той же причине, что и у шага
          # обратных ссылок ниже: умолчание в закреплённой версии — СТАРОЕ имя.
          # Замер 2026-09-03: задача «входящие» несла ссылку на
          # `claude-code-playbook`, а экспорт тянулся по редиректу — и это при
          # зелёном прогоне, потому что редирект работает.
          catalogue: ArtVsMark/Engineering-Incidents-Playbook

      # Обратная сторона следа: у правила каталога есть номер задачи отсюда, а
      # у самой задачи о правиле не сказано ни слова. Читатель задачи не узнаёт,
      # что из неё вышло правило, и следующий разбор того же места начинается с
      # нуля — вывод прошлого лежит в другом репозитории.
      #
      # Замер 2026-09-03: восемь правил каталога ведут след сюда (048, 166–169,
      # 171, 175, 176), и ни одна из восьми задач об этом не знает.
      #
      # Инструмент каталога, а не свой: копия алгоритма у каждого потребителя —
      # это N реализаций одного (CONNECT.md, правила 090 и 022). Запускает его
      # потребитель — своим токеном и в свой трекер, каталог не рассылает.
      - uses: actions/checkout@v4
        with:
          repository: ArtVsMark/Engineering-Incidents-Playbook
          ref: v1.4.0
          path: .rules-catalogue
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # ЖИВАЯ выгрузка каталога — единственная сторона контракта, у которой
      # версия машиночитаема. Ветка `main`, а не закреплённый тег: смысл шага
      # в том, чтобы заметить подъём У ИЗДАТЕЛЯ, а закреплённая копия показала
      # бы прошлое и молчала бы вечно.
      - uses: actions/checkout@v4
        with:
          repository: ArtVsMark/Engineering-Incidents-Playbook
          ref: main
          path: .rules-live
          fetch-depth: 1

      # СВЕРКА ВЕРСИИ ЧУЖОГО КОНТРАКТА (#85, правило 157). Сверка версии
      # ОТВЕТА в scripts/rules_answer.py односторонняя по построению: обе её
      # стороны наши — поле нашего файла и константа этого же репозитория.
      # Подъём у издателя она не заметит никогда.
      #
      # Здесь слева наша константа, справа файл каталога — и это единственное
      # место, где сверка настоящая. Версия формата ОТВЕТА так не проверяется:
      # контракт объявляет её прозой, в таблице полей, и числа у неё нет. Эта
      # граница названа здесь, а не обнаружится потом.
      #
      # Красное отсюда — не поломка, а сигнал перечитать контракт: у прогона по
      # расписанию есть адресат (#90), и задача заведётся сама.
      - name: версия выгрузки каталога не поднялась молча
        run: |
          python scripts/rules_answer.py \
            --catalogue-export .rules-live/export/rules.json

      - name: обратные ссылки на правила в задачах
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `--apply` обязателен: умолчание скрипта сухое, и это его решение —
        # «случайно запустил» не должно означать «прошёлся по восьми задачам».
        # Метка не ставится: её пришлось бы сперва завести в docs/labels.md,
        # а номенклатура меток — отдельное решение владельца.
        #
        # КОД берётся с закреплённого тега (шаг выше), а ДАННЫЕ — с `main`, и
        # это не небрежность. Первая редакция брала по тегу и то, и другое;
        # прогон прошёл зелёным и не сделал НИЧЕГО: в `v1.1.0` каталога 152
        # правила, и ни одно из них не ведёт след сюда — все восемь появились
        # позже тега. Механизм подтверждается прогоном, а не чтением, и
        # зелёный гейт подтверждает себя, а не утверждение, вокруг которого
        # построен.
        #
        # Схему выгрузки скрипт не проверяет: читает поле `trails`. С выгрузки
        # 1.5 у следа есть вторая форма — документ, `{"repo","doc","section"}`,
        # без `issue`. Перечитано при подъёме до v1.4.0: скрипт берёт номер
        # через `trail.get("issue")` и запись-документ пропускает, а не падает.
        # Появится тег каталога новее — закрепление поднимется вместе с ним.
        #
        # ИМЯ КАТАЛОГА НАЗЫВАЕТСЯ ЯВНО, и это не многословность. Умолчание в
        # скрипте версии v1.1.0 — старое имя `claude-code-playbook`; в v1.2.0
        # оно исправлено, и явное указание стало вторым слоем, а не
        # единственным. Слой не снимается: он верен при любом теге, включая
        # откат на прежний. Первый рабочий прогон вписал в задачу
        # #63 ссылку на имя, которого больше нет: данные притянулись по
        # редиректу, и ничто не покраснело.
        #
        # Это собственное правило проекта (172, оно же наше предложение
        # каталогу): редирект держится, пока старое имя СВОБОДНО. Здесь цена не
        # битая ссылка — по этому адресу мы вставляем ссылки в свои же задачи.
        # Перепись `scripts/repo_links.py` такого не ловит: имя жило в чужом
        # скрипте, а не в нашем дереве. Названное здесь — ловит.
        #
        # КОД ВОЗВРАТА ЧИТАЕТСЯ КАК ЕСТЬ — с v1.4.0. До него код 1 при
        # `--apply` значил «дописано», а не отказ: скрипт считал недостающие ДО
        # записи и не очищал их после, и все прогоны с работой краснели (замер
        # 2026-09-04, задача #102). Здесь стояла обёртка, принимавшая единицу
        # вместе с напечатанным «дописано». Инцидент уехал каталогу
        # предложением и починен у него (правило 186): теперь считается
        # ОСТАТОК после записи, и при `--apply` исходов два — 0 или 2.
        # Обёртка снята при подъёме тега, а не оставлена «на всякий случай»:
        # мёртвая ветка в разборе кода — это вторая редакция смысла, которая
        # разойдётся с первой молча.
        run: |
          python .rules-catalogue/scripts/link_trails.py \
            --catalogue ArtVsMark/Engineering-Incidents-Playbook \
            --ref main \
            --apply
