# Очередь мержей: обход состояния и не больше одного мержа за прогон (#8).
#
# ПРО РАСПИСАНИЕ — ПО ЗАМЕРУ, А НЕ ПО НАМЕРЕНИЮ. Оно заведено страховкой:
# доставка вебхуков не гарантирована, и пропущенное событие означало бы вечно
# стоящий зелёный PR.
#
# Замер за 36 часов: cron `13,43 * * * *` обещает 72 срабатывания, случилось
# 10. Интервалы между ними — от 1 ч 56 мин до 5 ч 48 мин, и ни одно не попало
# ни на :13, ни на :43 (17:04, 21:53, 01:18, 06:46, 12:34, …). Соседний
# ежедневный `17 6 * * *` в этом же репозитории все четыре раза опоздал на
# 5–7 часов.
#
# Отсюда правило: **cron у площадки — не частота, а пожелание.** Он говорит
# «когда-нибудь», и на роль страховки для того, что обязано случиться за
# минуты, не годится в принципе. Первые сутки он вообще не срабатывал, и по
# ним был сделан вывод «не работает»; замер показал точнее — работает, но
# впятеро-вшестеро реже заказанного.
#
# Поэтому очередь просыпается от СОБЫТИЙ — всех, какие могут сделать PR
# готовым. Расписание остаётся дополнением: убирать незачем (обход стоит
# 8 секунд и идемпотентен), опираться нельзя.
#
# ПОЧЕМУ ПОСЛЕ ПРОГОНА НА main. Голова очереди отстаёт ровно в момент, когда в
# `main` что-то уехало. Ждать до следующего получаса значило бы держать
# готовый PR без причины.
#
# ЧЕГО ЗДЕСЬ НЕТ. Открывалки PR для веток `agent/**`. Само имя ветки у нас
# соглашение — так называются ветки агентского окна, и держит это гейт
# разметки. А открывалка у соседа заведена по другой причине: его окно не может
# открыть PR от имени человека — прокси подменяет учётные данные, и автором
# становится бот. Здесь этого не происходит: PR, открытые окном, числятся за
# владельцем. Имя перенесено, механизм без своей причины — нет.
name: очередь мержей

on:
  schedule:
    # Не в 0 и не в 30: минута выбрана так, чтобы не совпадать с пиком, когда
    # площадка обслуживает все расписания планеты разом.
    - cron: "13,43 * * * *"
  # Без фильтра по ветке — и это не небрежность, а починка простоя.
  #
  # Сначала здесь стояло `branches: [main]`: казалось, очередь должна
  # просыпаться, когда в общую ветку что-то уехало. Но её собственное действие —
  # обновление головы из `main` — запускает прогон **на ветке PR**, а не на
  # `main`. То есть после каждого `update-branch` очередь засыпала до
  # расписания, хотя всё, чего она ждала, было готово через минуту: цикл
  # «обновил → прогон → смержил» растягивался на два расписания вместо двух
  # минут.
  #
  # Замер: за первый час работы очередь сделала два обхода и не смержила
  # ничего — первый застал черновик, второй обновил ветку и уснул.
  #
  # Лишние обходы дёшевы (8 секунд) и идемпотентны: очередь вычисляет
  # состояние заново каждый раз, а concurrency-группа не даёт двум обходам
  # мержить внахлёст.
  workflow_run:
    # ВСЕ workflow, которые ходят по `pull_request`, а не только `ci`.
    #
    # С появлением `PR check` (#6) последним на pull request зеленеет не `ci`:
    # обязательная проверка ждёт всех остальных ПО ПОСТРОЕНИЮ, значит
    # завершается последней — и живёт в отдельном workflow. Пока в списке
    # стояло одно имя, момент готовности PR очередь не видела никогда и
    # узнавала о нём случайно, со следующего прогона где-нибудь ещё.
    #
    # Замер: PR #41 стал `clean` в 10:35 и простоял 50 минут при нуле обходов.
    #
    # Список сверяется с деревом тестом `test_очередь_просыпается_от_всех_
    # проверок_pr`: имя, добавленное в workflow и забытое здесь, вернёт ровно
    # этот простой.
    workflows:
      - ci
      - обязательная проверка
      - разметка PR
      - запись changelog
    types: [completed]
  # У события всегда есть ручная кнопка.
  workflow_dispatch:
    inputs:
      dry-run:
        description: показать решение, ничего не меняя
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # На репозиторий, а не на ветку: два обхода разом смержили бы два PR
  # внахлёст — ровно то, чего очередь избегает.
  group: merge-queue
  cancel-in-progress: false

jobs:
  move:
    name: подвинуть очередь
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Секрет кладётся в env, а не проверяется в `if` напрямую: контекст
    # `secrets` в условиях шага не гарантирован, а `env` — документированный
    # приём именно для этой проверки.
    env:
      MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Секрета нет — предупреждаем и выходим, а не падаем. Красный прогон
      # здесь означал бы поломку механизма, а не ненастроенное удобство: до
      # выдачи токена очередь просто не двигается, и это законное состояние.
      - name: Секрет очереди не задан
        if: env.MERGE_QUEUE_TOKEN == ''
        run: |
          echo "::warning::MERGE_QUEUE_TOKEN не задан — очередь не двигается." \
               "Нужен токен с правами contents:write, pull-requests:write и" \
               "issues:write (метки конвейера). GITHUB_TOKEN не подходит:" \
               "мерж от него не запускает прогон на main, и следующий PR" \
               "будет судить по прогону, которого нет"

      - name: обход очереди
        if: env.MERGE_QUEUE_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.MERGE_QUEUE_TOKEN }}
        run: |
          python scripts/merge_queue.py \
            ${{ inputs.dry-run && '--dry-run' || '' }}
