# Единственная обязательная проверка защищённой `main` — `PR check` (#6).
#
# ПОЧЕМУ ОДНО ИМЯ, А НЕ СПИСОК. Ruleset требует проверки по имени, и имя
# попадает в настройку дословно. Матрица из девяти ячеек означала бы список из
# одиннадцати имён вида `гейты · ubuntu-latest · python 3.13`, а переименование
# ячейки — переход на 3.14, скажем — оставило бы в ruleset имя, которого больше
# никто не создаёт: PR ждал бы такую проверку вечно. Issue #6 назвала эту
# ловушку заранее. Здесь обязательное имя ровно одно и не меняется.
#
# ПОЧЕМУ ТЕ ЖЕ СОБЫТИЯ, ЧТО У РАЗМЕТКИ И CHANGELOG. Вердикт обязан
# пересчитаться тогда же, когда меняется ответ любого из гейтов. Метку навесили
# — гейт разметки позеленел, а `PR check` без события остался бы красным, и
# починка не давала бы зелёного: PR заблокирован навсегда до следующего пуша.
#
# ПОЧЕМУ ДЖОБ НИ ОТ ЧЕГО НЕ ЗАВИСИТ. Для защиты ветки **пропущенный** джоб
# засчитывается как пройденный. Агрегатор через `needs:` при падении
# зависимости не краснеет, а пропускается — то есть разрешает мерж ровно в тот
# момент, когда обязан запретить. Этот джоб доходит до вердикта всегда.
#
# ЧТО ИМЕННО СВЕРЯЕТСЯ. Прогоны на голове PR, а не имена джобов. Первая
# редакция сверяла имена с эталоном — джобами последнего прогона `ci` на
# `main`, — и ломала любой PR, который состав проверок МЕНЯЕТ: подъём Python с
# 3.13 на 3.14 даёт другие имена, эталон приходит из прошлого, вердикт «джобы
# не созданы» становится вечным. Починить в PR было нельзя: чтобы эталон
# обновился, изменение должно сначала уехать в `main` (#46).
name: обязательная проверка

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review
      - converted_to_draft

permissions:
  # Нужен checkout: состав обязательных прогонов читается из дерева ЭТОГО PR,
  # а не с общей ветки — см. `scripts/pr_check.py` и #46.
  contents: read
  # Читает прогоны на голове PR. Права на запись не нужны: вердикт — это цвет
  # самого джоба, а не отдельный check-run, созданный через API.
  actions: read

concurrency:
  # ГОЛОВА В ИМЕНИ ГРУППЫ — НЕ УКРАШЕНИЕ. Без неё прогоны на РАЗНЫХ коммитах
  # попадают в одну группу, и вытеснить может более новый: события площадки
  # приходят не в том порядке, в каком сделаны коммиты. Замер на #87 —
  # `labeled` встал в очередь до `synchronize`, а доставлен после и принёс
  # устаревшую голову; выжил он, посчитал старый коммит, а на актуальном
  # обязательной проверки не осталось вовсе. Держит scripts/concurrency_head.py.
  group: pr-check-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  verdict:
    # ИМЯ СОВПАДАЕТ С КОНТЕКСТОМ В RULESET ДОСЛОВНО. Переименование здесь
    # равносильно снятию защиты с `main`: ruleset начнёт ждать имя, которого
    # никто больше не создаёт, и ни один PR не станет мержимым.
    name: PR check
    runs-on: ubuntu-latest
    # Ожидание внутри скрипта ограничено десятью минутами; таймаут джоба стоит
    # с запасом, чтобы красным становился вердикт, а не сам прогон.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Ни установки пакета, ни группы dev: скрипт обходится стандартной
      # библиотекой. Ставить сюда зависимости значило бы сделать обязательную
      # проверку заложницей сборки.
      - name: все остальные проверки зелены
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/pr_check.py --sha "${{ github.event.pull_request.head.sha }}"
