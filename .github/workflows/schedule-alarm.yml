# Адресат для красного по расписанию (#90).
#
# ПОЧЕМУ ОТДЕЛЬНЫЙ ПРОГОН, А НЕ ШАГ `if: failure()` ВНУТРИ КАЖДОГО. Шагу нужно
# право писать задачи, а оно досталось бы и всему остальному в том прогоне —
# очередь мержей получила бы `issues: write` вдобавок к своим и без того
# широким возможностям. Здесь право выдано одному маленькому прогону, который
# ничего, кроме одной задачи, не делает.
#
# ПОЧЕМУ ОН НЕ ПО РАСПИСАНИЮ. Сторож по расписанию сам был бы прогоном без
# адресата — ровно тем, что чинится. Событие `workflow_run` приходит от
# площадки: сторож просыпается ровно тогда, когда есть о чём говорить.
#
# ЧЕГО ОН НЕ ЛОВИТ, И ЭТО СКАЗАНО ВСЛУХ. Прогон, умерший так, что события о
# завершении не пришло вовсе (снятый раннер, отменённая площадкой очередь).
# Отличить такое молчание от «не запускалось» можно только опросом по времени,
# то есть ещё одним прогоном по расписанию — у которого была бы та же беда.
name: будильник расписаний

on:
  workflow_run:
    # ИМЕНА ЗДЕСЬ ДОСЛОВНЫЕ, и в этом их хрупкость: переименовать прогон
    # значит тихо отключить сторожа — площадка начнёт ждать имени, которого
    # никто не создаёт. Та же ловушка, что у обязательной проверки. Держит
    # тест: каждый workflow с `schedule:` обязан быть в этом списке.
    workflows:
      - очередь мержей
      - rules-inbox
    types:
      - completed

permissions:
  # Единственное право прогона, и оно же единственная причина его отдельности.
  issues: write

concurrency:
  # ОТМЕНА ВЫКЛЮЧЕНА НАМЕРЕННО. Сторож просыпается на каждое завершение
  # наблюдаемого прогона, и вытеснение одного другим потеряло бы событие —
  # закрытие задачи по зелёному, например. Прогон стоит секунды.
  group: schedule-alarm-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  alarm:
    name: будильник
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Ни установки пакета, ни группы dev: скрипт обходится стандартной
      # библиотекой, как и остальные скрипты конвейера.
      - name: завести или закрыть задачу об упавшем прогоне
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ЧЕРЕЗ ОКРУЖЕНИЕ, А НЕ ПОДСТАНОВКОЙ В КОМАНДУ. Имя прогона и ссылка
          # приходят от площадки, то есть снаружи этого файла; подставленные
          # прямо в `run:` они стали бы кодом оболочки.
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          python scripts/schedule_alarm.py \
            --workflow "$WORKFLOW_NAME" \
            --conclusion "$RUN_CONCLUSION" \
            --run-url "$RUN_URL"
