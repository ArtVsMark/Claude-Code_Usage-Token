# Ответ ЭТОГО проекта по каждой своей проверке — заготовка к переезду на
# конвейер механизмов (#158, карта замены; подключение шагов — #138).
#
# ФОРМА ЧУЖАЯ, ОТВЕТ СВОЙ. Формат — schema 4 договора механизмов
# (Engineering-Pipeline-Mechanisms, docs/use/pipeline.md): класс проверки —
# свойство проекта, а не механизма, и назвать его обязан подключающийся.
# Классы: required — держит слияние; advisory — не держит, но красное обязано
# дойти до адресата, переживающего слияние; off — выключена с причиной;
# unreviewed — ответа ещё нет. «Записи нет» говорится словом `none`, а не
# пропуском поля (правило 154 каталога).
#
# ЧЕГО ЭТОТ ФАЙЛ ПОКА НЕ ДЕЛАЕТ. Сегодня его не читает ничто в нашем дереве:
# слияние держит `PR check` (scripts/pr_check.py), и состав обязательного он
# берёт из дерева изменения, а не отсюда. Файл начнёт действовать, когда
# сводным станет их `ci_complete.py`, а полноту ответа будет держать их
# `check_pipeline.py` шагом `pipeline` (#138). До тех пор он сверяется их
# механизмом вручную, а расхождение с деревом молча копится — это названо, а не
# сглажено.
#
# Сводного гейта (`PR check`) здесь нет намеренно: его класс задан построением,
# он единственный обязательный контекст защиты и сам себя не опрашивает.

schema: 4

# Механизмы выпущены с контрактом 0.7. Окно — два минора: тот, на котором
# стоим, и тот, на который перейдёт их следующий выпуск. Верхняя граница
# обязательна (073): без неё несовместимая версия применялась бы молча.
contract: ">=0.7,<0.9"

checks:
  # Держат слияние: сегодня через `PR check`, после переезда — через их
  # сводный гейт. Класс от переезда не меняется.
  "зона, тип, связь с задачей и имя ветки": required
  "запись есть и она на языке проекта": required

  # МАТРИЦА ОБЯЗАТЕЛЬНОЙ БЫТЬ НЕ МОЖЕТ ПО ИХ ПОСТРОЕНИЮ, хотя по смыслу держит
  # слияние. Имена ячеек несут ОС и версию («гейты · ubuntu-26.04 · python
  # 3.14»), а имени джоба на голове не появляется вовсе. Наш `pr_check.py`
  # судит ячейки по составу из дерева; их `ci_complete.py` опрашивает имя и
  # ждёт для матрицы обязательного агрегата (у механизмов — джоб `test`).
  # Агрегата у нас нет, и до переезда его нужно завести — иначе после
  # переезда гейты слияния держать перестанут.
  "гейты · ${{ matrix.os }} · python ${{ matrix.python }}":
    class: advisory
    why: вердикт по ячейкам выносит сводный PR check; у их сводного для этого нужен агрегат, которого у нас ещё нет
    addressee: scripts/pr_check.py

beyond_the_change:
  # Прогоны по расписанию и по завершении чужого прогона. Их красное ловит
  # будильник расписаний: одна задача на прогон, закрывается по зелёному
  # (CLAUDE.md, «У красного по расписанию есть адресат»).
  "подвинуть очередь":
    class: advisory
    why: двигает очередь мержей; пока она лежит, не мержится ничего
    addressee: scripts/schedule_alarm.py
  inbox:
    class: advisory
    why: приносит входящие каталога правил; вердикта по изменению не выносит
    addressee: scripts/schedule_alarm.py
  "собрать и положить на ветку":
    class: advisory
    why: рисует значки и факты на своей ветке; слияния не касается
    addressee: scripts/schedule_alarm.py

  # Предрелиз Python: обещания работать на 3.15 проект не давал. Будильник его
  # не сторожит намеренно (schedule_alarm.БЕЗ_ПРИСМОТРА), поэтому записи нет.
  "следующий Python · 3.15":
    class: advisory
    why: предрелизная версия; задача-тревога висела бы неделями и приучала бы не читать будильник (#127)
    addressee: none

  # Прогоны по кнопке: исход видит тот, кто нажал, и переживать слияние ему
  # нечего — слияния у них нет.
  "собрать, проверить и выпустить":
    class: advisory
    why: выпуск идёт кнопкой и тегом; исход читает выпускающий
    addressee: none
  "взвести, прочитать, снять":
    class: advisory
    why: проба авто-мержа до доверия; её итог владелец переносит в задачу
    addressee: "#165"

  # Сторож сам себя не сторожит: будильник для будильника был бы той же бедой
  # этажом выше. Чего он не ловит, сказано в его шапке.
  будильник:
    class: advisory
    why: адресат для красного по расписанию; его собственное красное видно только на вкладке прогонов
    addressee: none
